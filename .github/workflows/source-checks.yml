name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit public tree
        run: python tools/check_public_tree.py
      - name: Compile Python sources
        run: python -m compileall -q src tests benchmarks tools examples
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
