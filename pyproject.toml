[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convrot-mlx"
version = "0.1.0"
description = "ConvRot W4A4 kernels and reproducible benchmarks for Apple Silicon and MLX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Lumenbeing contributors" }]
keywords = ["mlx", "apple-silicon", "metal", "quantization", "convrot", "w4a4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mlx>=0.32.0,<0.33.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
test = ["numpy>=2.0"]
flux = [
  "huggingface-hub>=1.27,<2",
  "numpy>=2.0",
  "Pillow>=12",
  "regex>=2026.7",
  "sentencepiece>=0.2",
  "tqdm>=4.70",
]

[project.urls]
Homepage = "https://github.com/Lumenbeing/convrot-mlx"
Repository = "https://github.com/Lumenbeing/convrot-mlx"
Issues = "https://github.com/Lumenbeing/convrot-mlx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convrot_mlx = ["py.typed"]
